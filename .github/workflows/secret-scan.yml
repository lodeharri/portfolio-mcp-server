name: secret-scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Nightly full-history scan, 03:00 UTC. Catches anything that slipped
    # through the pre-commit hook (e.g., commits made before the hook was
    # installed).
    - cron: "0 3 * * *"

jobs:
  gitleaks:
    name: gitleaks (full history, redacted report)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history for full-history scan

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}   # optional; free tier is enough for public repos
        with:
          args: detect --redact --report-path gitleaks-report.json --source . --no-banner

      - name: Upload gitleaks report
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json
        if: always()

  detect-secrets:
    name: detect-secrets (baseline diff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10.12"

      - name: Install detect-secrets
        run: pip install "detect-secrets==1.5.0"

      - name: Scan for new secrets vs baseline
        run: |
          # First-time bootstrap: `detect-secrets scan > .secrets.baseline`.
          # The baseline is committed; CI fails only on NEW findings.
          detect-secrets scan --baseline .secrets.baseline \
            --exclude-files 'data/.*|\.git/.*|.*\.lock|.*-lock\.yaml' \
            > /dev/null
