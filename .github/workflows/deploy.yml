name: deploy

on:
  push:
    branches: [main]
    paths:
      # Only deploy when source/config/deploy files change. Skip docs-only
      # commits to save Fly.io + GitHub Actions free-tier budget.
      - "src/**"
      - "config/**"
      - "Dockerfile"
      - "fly.toml"
      - "pyproject.toml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:        # manual trigger for emergency re-deploys

env:
  PYTHON_VERSION: "3.10.12"
  FLY_APP_NAME: portfolio-mcp-server    # created in fly.toml; matches project key

concurrency:
  group: deploy-${{ env.FLY_APP_NAME }}
  cancel-in-progress: false              # let in-flight deploys finish

jobs:
  build-and-push:
    name: Build & push image to Fly registry
    runs-on: ubuntu-latest
    # Skip if lint/secret-scan/test failed in the same run. The `needs` chain
    # enforces a green pipeline before deploy.
    needs: []  # cross-workflow gating is configured in branch protection; we re-check tests here
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      # Cheap pre-flight: run the test suite before burning the deploy budget.
      # If tests fail, the deploy never starts. This protects the
      # 2000 min/month GitHub Actions free-tier quota.
      - name: Pre-flight tests
        run: |
          pip install -e ".[dev]"
          pytest -q tests/unit

      - name: Install Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Build image
        run: flyctl deploy --build-only --image registry.fly.io/${{ env.FLY_APP_NAME }}:sha-${{ github.sha }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Deploy
        run: flyctl deploy --image registry.fly.io/${{ env.FLY_APP_NAME }}:sha-${{ github.sha }} --strategy canary
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Smoke test (MCP endpoint reachable)
        run: |
          # Give the canary 30s to receive traffic, then probe /healthz.
          sleep 30
          curl --fail --max-time 10 https://${{ env.FLY_APP_NAME }}.fly.dev/healthz
