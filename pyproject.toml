[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-server-playground"
version = "0.1.0"
description = "Harrison Rodriguez's MCP server with web playground — portfolio piece #2"
readme = "README.md"
requires-python = ">=3.10.12,<3.13"
license = { text = "MIT" }
authors = [
    { name = "Harrison Rodriguez" },
]
keywords = ["mcp", "model-context-protocol", "fastapi", "playground", "portfolio"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

# Runtime dependencies — declared at init, installed in change 001-bootstrap
dependencies = [
    "fastapi>=0.115.0",                  # Web framework + ASGI server
    "uvicorn[standard]>=0.32.0",         # ASGI server
    "fastmcp>=3.2.4",                    # Python MCP SDK server (latest, verified 2026-08)
    "jinja2>=3.1.4",                     # Templates for the playground
    "pydantic>=2.9.0",                   # Data validation
    "langchain>=0.3.0",                  # Agent orchestration
    "langchain-text-splitters>=0.3.0",   # Language-aware source chunking
    "langchain-google-genai>=2.0.0",     # Gemini chat model integration
    "langgraph>=0.2.0",                  # ReAct agent runtime
    "google-genai>=1.0.0",               # NEW Gemini SDK (replaces deprecated google-generativeai; ~50 MB smaller)
    "python-dotenv>=1.0.0",              # Loads .env file for local dev (no effect in Docker)
    "slowapi>=0.1.9",                    # Rate limiting (~30 req/min/IP)
    "structlog>=24.1.0",                 # Structured JSON logging for security/audit.py
    "sqlite-vec>=0.1.0",                 # Vector search extension (single-file, no external DB)
    "python-multipart>=0.0.12",          # For HTMX form posts (HTMX form posts in playground)
    "pyyaml>=6.0",                       # projects.manifest.yaml parser
]

[project.optional-dependencies]
# All three groups MUST be installable in the dev environment.
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.7.0",
]
e2e = [
    "playwright>=1.48.0",
    "axe-playwright-python>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/lodeharri/portfolio-mcp-server"
Issues = "https://github.com/lodeharri/portfolio-mcp-server/issues"

# Entry point: `mcp-server` starts the FastAPI app (uvicorn src.mcp_server.app:app)
[project.scripts]
mcp-server = "mcp_server.app:run"
preindex = "mcp_server.interfaces.cli.preindex:cli"

[tool.setuptools.packages.find]
where = ["src"]

# Include non-Python data files in the wheel so `pip install` ships them
# inside the venv package directory. Without this, `schema.sql` is not
# found at runtime — the connection helper looks for it next to
# `connection.py` inside the installed package.
[tool.setuptools.package-data]
mcp_server = ["infrastructure/db/schema.sql"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
# Security-sensitive modules get stricter rules
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "S",    # flake8-bandit (security)
    "RUF",  # ruff-specific rules
]
ignore = [
    "S101",  # Use of `assert` — allowed in tests, gate with per-file-ignores below
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",  # asserts
    "S106",  # hardcoded passwords in test fixtures
    "S108",  # /tmp in test fixtures is intentional
    "S608",  # f-string SQL in test fixtures is safe (table names are internal)
]
"src/mcp_server/infrastructure/adapters/sqlite_vec_store.py" = [
    "S608",  # f-string SQL with internal table names (not user input)
]
"src/mcp_server/infrastructure/adapters/gemini_embedding.py" = [
    "S311",  # random.uniform for retry jitter is not crypto
]
"src/mcp_server/infrastructure/adapters/gemini_llm.py" = [
    "S311",  # random.uniform for retry jitter is not crypto
]
"tests/integration/test_docker_size.py" = [
    "S607",  # subprocess for docker is fixed
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "unit: fast, isolated unit tests",
    "integration: requires running services (sqlite, fakeredis)",
    "e2e: requires Playwright browser",
    "security: redaction and secret-scan tests",
]

[tool.coverage.run]
source = ["src/mcp_server"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
show_missing = true
skip_covered = false
fail_under = 60
